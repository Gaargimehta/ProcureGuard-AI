version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: procureguard-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/datasets:/app/datasets
      - ./backend/reports:/app/reports
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: procureguard-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped
